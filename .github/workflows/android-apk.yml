name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release signing
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::A signed release requires ANDROID_KEYSTORE_BASE64 and the matching signing secrets."
            exit 1
          fi

      - name: Set Android version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^app-v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            version_name="$major.$minor.$patch"
            version_code=$((major * 1000000 + minor * 1000 + patch))
          else
            version_name="1.0"
            version_code="1"
          fi
          echo "ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VITE_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - run: npm ci
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ANDROID_VERSION_CODE: ${{ env.VITE_ANDROID_VERSION_CODE }}
      - run: npx cap sync android

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK (signed)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build debug APK (manual runs only)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: chartmasters-apk
          path: android/app/build/outputs/apk/**/*.apk

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ChartMasters ${{ env.ANDROID_VERSION_NAME }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
