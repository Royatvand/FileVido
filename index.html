<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d0c" />
    <meta name="description" content="چارت مسترز (ChartMasters)؛ یادگیری بازارهای مالی با ویدیوهای آموزشی ترجمه‌شده به فارسی." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChartMasters" />
    <meta property="og:title" content="چارت مسترز | ChartMasters" />
    <meta property="og:description" content="آموزش بازارهای مالی با ویدیوهای آموزشی منتخب و ترجمه فارسی." />
    <meta property="og:url" content="https://chartmasters.top/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/favicon-192x192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://chartmasters.top/" />
    <title>چارت مسترز | ChartMasters</title>
    <script>
      (function () {
        var files = {
          dastkhat: '/fonts/dastkhat/DastkhatFaNum-Variable.woff2',
          diamond: '/fonts/dastkhat/DastkhatDiamondFaNum-Variable.woff2',
          dots: '/fonts/dastkhat/DastkhatDotsFaNum-Variable.woff2',
          bar: '/fonts/dastkhat/DastkhatBarFaNum-Variable.woff2',
          bardots: '/fonts/dastkhat/DastkhatBarDotsFaNum-Variable.woff2',
          mono: '/fonts/dastkhat/DastkhatMono-Variable.woff2'
        }
        try {
          var font = localStorage.getItem('chartmasters-font')
          if (!files[font]) return
          document.documentElement.dataset.font = font
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'font'
          link.type = 'font/woff2'
          link.crossOrigin = 'anonymous'
          link.href = files[font]
          document.head.appendChild(link)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
