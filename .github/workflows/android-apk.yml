name: Build and publish Android APK

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: Release notes entered by the admin
        required: true
        type: string
      is_mandatory:
        description: Force users to update
        required: true
        default: false
        type: boolean
  push:
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Calculate release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/app-v* ]]; then
            version_name="${GITHUB_REF_NAME#app-v}"
            if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag must use the app-vMAJOR.MINOR.PATCH format."
              exit 1
            fi
            version_code=$(git tag -l 'app-v[0-9]*' | wc -l | tr -d ' ')
          else
            latest=$(git tag -l 'app-v[0-9]*' --sort=-v:refname | head -n 1)
            if [[ -z "$latest" ]]; then latest="app-v1.0.0"; fi
            current=${latest#app-v}
            IFS='.' read -r major minor patch <<< "$current"
            patch=$((patch + 1))
            version_name="$major.$minor.$patch"
            version_code=$(git tag -l 'app-v[0-9]*' | wc -l | tr -d ' ')
            version_code=$((version_code + 1))
          fi

          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$version_name" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: npx cap sync android

      - name: Set Android version
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build debug APK fallback
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare public APK
        shell: bash
        run: |
          mkdir -p release
          apk=$(find android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)
          test -n "$apk"
          cp "$apk" release/app-release.apk

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ChartMasters v${{ steps.version.outputs.name }}
          body: ${{ inputs.changelog }}
          files: release/app-release.apk

      - name: Publish manually tagged release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          name: ChartMasters v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: release/app-release.apk

      - name: Register release and notify users
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CHANGELOG: ${{ github.event_name == 'workflow_dispatch' && inputs.changelog || '' }}
          IS_MANDATORY: ${{ github.event_name == 'workflow_dispatch' && inputs.is_mandatory || false }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG=$(git log -1 --pretty=%s "$GITHUB_SHA")
          fi

          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/app-release.apk"
          response_file="$RUNNER_TEMP/register-app-release.json"
          http_status=$(curl --location --max-redirs 5 --silent --show-error \
            --output "$response_file" --write-out "%{http_code}" \
            -X POST "https://www.chartmasters.top/api/register-app-release" \
            -H "Content-Type: application/json" \
            -H "x-release-secret: ${RELEASE_TOKEN}" \
            -d "$(jq -n --arg name "$VERSION_NAME" --argjson code "$VERSION_CODE" --arg url "$asset_url" --arg notes "$CHANGELOG" --argjson mandatory "$IS_MANDATORY" '{version_name:$name,version_code:$code,download_url:$url,changelog:$notes,is_mandatory:$mandatory}')")
          cat "$response_file"

          if [[ ! "$http_status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Release registration endpoint returned HTTP $http_status."
            exit 1
          fi

          if ! jq -e '.status == "published" and .version.id' "$response_file" >/dev/null; then
            echo "::error::Release registration endpoint did not confirm a published version."
            exit 1
          fi
